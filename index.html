<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08121e" />
    <meta
      name="description"
      content="Search the Monster Hunter card collection by monster name using the full image library in the cards folder."
    />
    <title>Monster Hunter Card Search</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/monster-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap">
        <details class="collection-menu">
          <summary class="menu-button" aria-label="Open game card collections">&#9776;</summary>
          <div class="collection-options" role="menu" aria-label="Game card collections">
            <h2 class="collection-options-title">Game Collections</h2>
            <button type="button" role="menuitem" data-title="MONSTER HUNTER WORLD: ICEBORNE">
              Monster Hunter World: Iceborne
            </button>
            <button type="button" role="menuitem" data-title="MONSTER HUNTER RISE: SUNBREAK">
              Monster Hunter Rise: Sunbreak
            </button>
            <button type="button" role="menuitem" data-title="MONSTER HUNTER WILDS">
              Monster Hunter Wilds
            </button>
            <button id="install-button" class="install-button show" type="button" role="menuitem">
              Install App
            </button>
          </div>
        </details>
        <div>
          <p class="brand-label">Monster Hunter Cards</p>
          <h1>Custom Physiology Cards by Scytez</h1>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="search-panel">
        <div class="search-header">
          <div>
            <p class="eyebrow">GAME COLLECTION</p>
            <h2>MONSTER HUNTER WORLD: ICEBORNE</h2>
          </div>
        </div>

        <div class="search-box">
          <input id="search-input" type="search" placeholder="Search Monsters..." aria-label="Search card collection" />
          <span class="search-icon" aria-hidden="true">🔍︎</span>
        </div>

      </section>

      <section class="results-panel" aria-labelledby="results-title">
        <div class="results-head">
          <div class="results-left">
            <h3 id="results-title"></h3>
            <div class="result-pill"><span id="card-count">0</span> cards found</div>
          </div>
          <div class="results-controls">
            <div class="filter-control">
              <span id="filter-label">Show</span>
              <div class="custom-select" id="filter-select">
                <button class="custom-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="filter-label filter-select-value">
                  <span id="filter-select-value">All</span>
                </button>
                <div class="custom-select-options" role="listbox" tabindex="-1" aria-labelledby="filter-label">
                  <button type="button" role="option" aria-selected="true" data-value="all">All</button>
                  <button type="button" role="option" aria-selected="false" data-value="Base">Base</button>
                  <button type="button" role="option" aria-selected="false" data-value="Iceborne">Iceborne</button>
                </div>
              </div>
            </div>
            <div class="sort-control">
              <span id="sort-label">Sort by</span>
              <div class="custom-select" id="sort-select">
                <button class="custom-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="sort-label sort-select-value">
                  <span id="sort-select-value">Name</span>
                </button>
                <div class="custom-select-options" role="listbox" tabindex="-1" aria-labelledby="sort-label">
                  <button type="button" role="option" aria-selected="true" data-value="name">Name</button>
                  <button type="button" role="option" aria-selected="false" data-value="number">Number</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div id="card-grid" class="card-grid"></div>
      </section>
    </main>

    <div id="card-modal" class="card-modal hidden" role="dialog" aria-modal="true" aria-label="Fullscreen card viewer">
      <button id="modal-close" class="modal-close" type="button" aria-label="Close fullscreen card viewer">&times;</button>
      <button id="modal-previous" class="modal-nav modal-previous" type="button" aria-label="View previous card">&#10094;</button>
      <img id="modal-image" class="modal-image" src="" alt="" />
      <button id="modal-next" class="modal-nav modal-next" type="button" aria-label="View next card">&#10095;</button>
    </div>

    <script src="app.js"></script>
  </body>
</html>
